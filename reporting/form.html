<!DOCTYPE html>
<!-- The ANONYMOUS questionnaire fill page (2026-08-18, his call: "no one knows who is
     filling the form"). Standalone on purpose: no sign-in, no portal shell, no token —
     the ?t= link names a (questionnaire, team) pair and nothing else. A random id in
     THIS browser's localStorage lets answers autosave and resume; it is never tied to
     any account. Served from the same Pages repo as the portal; talks only to
     /api/_hrqanon, which sits in front of the bridge's auth on purpose. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zip to Zip — Questionnaire</title>
<style>
  :root{--bg:#f4f6f8;--panel:#ffffff;--panel-2:#eef1f4;--line:#e3e8ed;--line-2:#cfd7de;
        --ink:#16202c;--muted:#5b6b7c;--faint:#8a97a5;--brand:#7fa32b;--brand-ink:#ffffff;
        --brand-glow:#f0f5e3;--pos:#2ea05a;--warn:#e2a82b;--neg:#e24949}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
  .brand{display:flex;align-items:center;gap:10px;margin:6px 2px 18px;font-weight:800;
         font-size:15px;letter-spacing:-.2px}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--brand)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:22px 22px;margin-bottom:14px}
  .dim{font-size:12.5px;color:var(--faint);line-height:1.55}
  .conf{border-left:3px solid var(--warn);background:rgba(226,168,43,.07);
        border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.55;
        color:var(--muted);margin:14px 0 0}
  .anon{border-left:3px solid var(--brand);background:var(--brand-glow);
        border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.55;
        color:var(--muted);margin:14px 0 0;font-weight:600}
  .meta{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:10px}
  .go{font:inherit;font-size:14.5px;font-weight:800;padding:12px 26px;border-radius:11px;
      border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer}
  .go:disabled{opacity:.55}
  .btn{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:var(--panel);
       border:1px solid var(--line-2);border-radius:9px;padding:8px 14px;cursor:pointer}
  .pb{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin:2px 0 6px}
  .pb i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .3s}
  .top{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--faint)}
  .part{margin:18px 0 14px}
  .part .pn{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;
            text-transform:uppercase;color:var(--brand);margin-bottom:5px}
  .part b{font-size:20px;letter-spacing:-.3px}
  .part .pd{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}
  .q{background:var(--panel);border:1px solid var(--line);border-radius:14px;
     padding:15px 17px;margin-bottom:11px}
  .q .lab{font-size:14.5px;font-weight:750;line-height:1.35}
  .q .lab u{text-decoration:none;color:var(--neg);margin-left:4px}
  .q .opt{font-weight:600;font-size:11.5px;color:var(--faint);margin-left:6px}
  .q .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .q .body{margin-top:11px}
  .saved{font-size:11px;color:var(--pos);font-weight:700;min-height:15px}
  .stars{display:flex;gap:2px}
  .star{font-size:33px;line-height:1;cursor:pointer;background:none;border:0;padding:0 4px;
        color:var(--line-2)}
  .star.on{color:var(--warn)}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .num{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);
       background:var(--panel);font:inherit;font-size:14px;font-weight:700;
       color:var(--muted);cursor:pointer}
  .num.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .scalelab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);
            margin-top:5px;max-width:460px}
  .choice{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;
          border:1px solid var(--line-2);border-radius:9px;margin-bottom:6px;cursor:pointer;
          font-size:13.5px;line-height:1.4}
  .choice.on{border-color:var(--brand);background:var(--brand-glow)}
  .choice input{margin-top:2px}
  .oth{font:inherit;font-size:13px;border:0;border-bottom:1px solid var(--line-2);
       background:transparent;color:var(--ink);padding:2px 4px;flex:1;min-width:120px}
  .oth:focus{outline:none;border-bottom-color:var(--brand)}
  select.sel{font:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);
             border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;min-width:240px}
  textarea.ta{width:100%;font:inherit;font-size:13px;line-height:1.5;color:var(--ink);
              background:var(--panel);border:1px solid var(--line-2);border-radius:9px;
              padding:10px 12px;resize:vertical}
  textarea.ta:focus{outline:none;border-color:var(--brand)}
  .ct{font-size:10.5px;color:var(--faint);text-align:right;margin-top:3px}
  .navbar{position:sticky;bottom:12px;background:var(--panel);border:1px solid var(--line-2);
          border-radius:13px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:12px 15px;
          display:flex;gap:12px;align-items:center;margin-top:16px}
  .err{font-size:12.5px;color:var(--neg);font-weight:700}
  .rrow{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:10px;
        cursor:pointer;font-size:13.5px}
  .rrow:hover{background:var(--panel-2)}
  .rrow .tick{width:22px;height:22px;border-radius:50%;background:rgba(46,160,90,.15);
              color:var(--pos);display:inline-flex;align-items:center;justify-content:center;
              font-size:11px;font-weight:900;flex:0 0 auto}
  .rrow.miss .tick{background:rgba(226,73,73,.13);color:var(--neg)}
  .missb{border-color:var(--neg) !important}
  .lang{margin-left:auto;display:flex;gap:0;border:1px solid var(--line-2);border-radius:9px;
        overflow:hidden;background:var(--panel)}
  .lang button{font:inherit;font-size:12px;font-weight:800;padding:5px 11px;border:0;
        background:transparent;color:var(--muted);cursor:pointer}
  .lang button.on{background:var(--brand);color:var(--brand-ink)}
  .sect-done{text-align:center;padding:60px 20px}
  .sect-done .big{font-size:44px}
  .sect-done b{display:block;font-size:20px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Zip to Zip Moving
    <span class="lang" id="lang"><button data-l="en">EN</button><button data-l="ka">ქარ</button></span>
  </div>
  <div id="main"><div class="card dim">Loading…</div></div>
</div>
<script>
(function () {
  "use strict";
  var API = "https://ztz-bridge-32168089642.us-east4.run.app";
  var OTH = "Other…";
  var t = (new URLSearchParams(location.search).get("t") || "").toLowerCase();
  var main = document.getElementById("main");
  var esc = function (v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  /* STORAGE THAT CANNOT KILL THE PAGE. In storage-blocked browsers (in-app webviews,
     strict cookie settings, some private modes) the bare accessor itself throws, and it
     used to throw before the first paint — the reader stared at "Loading…" forever. A
     failed store now degrades to in-memory: autosave still works for the sitting; only
     resume-after-close is lost. */
  var mem = {};
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---- LANGUAGE (his ask 2026-08-17). The page's own words live here; the
  // questionnaire's words come from its `i18n` blob. THE STORED ANSWER IS ALWAYS THE
  // ENGLISH VALUE — only the label on screen changes — so results stay comparable
  // however each person read the form.
  var STR = {
    en: {
      loading: "Loading…", bad: "This link is not valid.",
      badSub: "Ask for a fresh questionnaire link.",
      parts: function (n) { return n + " part" + (n === 1 ? "" : "s"); },
      qs: function (n) { return n + " questions"; },
      saveNote: "answers stay on this device until you submit — you can come back any time",
      anon: function (team) { return "This form is anonymous. It records your team — " + team
        + " — and never your name, email or account. Nobody can see who wrote what."; },
      prevNote: "This is a PREVIEW — answers are not recorded anywhere. Walk through the form "
        + "exactly as the team will see it, then send your feedback.",
      answered: function (a, t) { return a + " of " + t + " answered"; },
      start: "Start", resume: "Continue where you left off", reviewGo: "Review & submit",
      partOf: function (i, n) { return "Part " + i + " of " + n; },
      intro: "← Intro", back: "← Back", next: "Next →", reviewNext: "Review & submit →",
      review: "Review", ready: "Ready to submit?",
      reviewNote: "Open any part to change an answer. Submitting is final — and anonymous.",
      reviewNotePv: "Open any part to change an answer. This is a preview — nothing is recorded.",
      submit: "Submit", submitting: "Submitting…", open: "open ›",
      missReq: function (n) { return " · " + n + " required still missing"; },
      optional: "optional", required: "required", other: "Other:", choose: "Choose…",
      yourAnswer: "Your answer…", fewSentences: "A few sentences is plenty.",
      saving: "saving…", saved: "saved on this device", notSaved: "NOT saved — ",
      topAnon: function (team) { return "Anonymous · team: " + team; },
      topPrev: "Preview · nothing is recorded",
      doneT: "Thank you — your answers are in.",
      doneS: function (team) { return "This form was anonymous: only your team (" + team
        + ") is recorded, never your name."; },
      donePvT: "That was the whole form — nothing was recorded.",
      donePvS: "This was a preview. Please send your feedback — what felt confusing, too long, "
        + "or missing — to whoever shared this link."
    },
    ka: {
      loading: "იტვირთება…", bad: "ბმული არასწორია.",
      badSub: "მოითხოვეთ ახალი ბმული.",
      parts: function (n) { return n + " ნაწილი"; },
      qs: function (n) { return n + " კითხვა"; },
      saveNote: "პასუხები გაგზავნამდე მხოლოდ ამ მოწყობილობაზე ინახება — შეგიძლიათ მოგვიანებით დაასრულოთ",
      anon: function (team) { return "ეს ფორმა ანონიმურია. ინახება მხოლოდ თქვენი გუნდი — "
        + trTeam(team) + " — და არასოდეს თქვენი სახელი, ელფოსტა ან ანგარიში. ვერავინ ნახავს ვინ რა დაწერა."; },
      prevNote: "ეს არის წინასწარი ნახვა — პასუხები არსად არ ინახება. გაიარეთ ფორმა ისე, "
        + "როგორც გუნდი ნახავს, და გამოგვიგზავნეთ თქვენი შენიშვნები.",
      answered: function (a, t) { return t + "-დან " + a + " შევსებულია"; },
      start: "დაწყება", resume: "გაგრძელება", reviewGo: "გადახედვა და გაგზავნა",
      partOf: function (i, n) { return "ნაწილი " + i + " / " + n; },
      intro: "← დასაწყისი", back: "← უკან", next: "შემდეგი →",
      reviewNext: "გადახედვა და გაგზავნა →",
      review: "გადახედვა", ready: "მზად ხართ გასაგზავნად?",
      reviewNote: "ნებისმიერი ნაწილი გახსენით პასუხის შესაცვლელად. გაგზავნა საბოლოოა — და ანონიმური.",
      reviewNotePv: "ნებისმიერი ნაწილი გახსენით პასუხის შესაცვლელად. ეს წინასწარი ნახვაა — არაფერი ინახება.",
      submit: "გაგზავნა", submitting: "იგზავნება…", open: "გახსნა ›",
      missReq: function (n) { return " · " + n + " სავალდებულო კითხვა დარჩა"; },
      optional: "არასავალდებულო", required: "სავალდებულო", other: "სხვა:", choose: "აირჩიეთ…",
      yourAnswer: "თქვენი პასუხი…", fewSentences: "რამდენიმე წინადადება საკმარისია.",
      saving: "ინახება…", saved: "შენახულია ამ მოწყობილობაზე", notSaved: "ვერ შეინახა — ",
      topAnon: function (team) { return "ანონიმური · გუნდი: " + trTeam(team); },
      topPrev: "წინასწარი ნახვა · არაფერი ინახება",
      doneT: "გმადლობთ — თქვენი პასუხები მიღებულია.",
      doneS: function (team) { return "ფორმა ანონიმური იყო: ჩაიწერა მხოლოდ თქვენი გუნდი ("
        + trTeam(team) + "), არასოდეს თქვენი სახელი."; },
      donePvT: "ეს იყო მთელი ფორმა — არაფერი ჩაწერილა.",
      donePvS: "ეს იყო წინასწარი ნახვა. გთხოვთ გამოგზავნოთ შენიშვნები — რა იყო გაუგებარი, "
        + "გრძელი ან დაკლებული — იმ ადამიანთან, ვინც ბმული გამოგიგზავნათ."
    }
  };
  /* THE SERVER'S ERROR SENTENCES, translated. The bridge answers in English; the form
     defaults to Georgian, and the failure moments — closed survey, submit race, device
     already used — are exactly when a reader needs their own language. Keyed on the exact
     bridge strings; an unknown message falls through untranslated rather than lying. */
  var SRV_KA = {
    "this questionnaire is not open right now": "ეს გამოკითხვა ამჟამად გახსნილი არ არის.",
    "this questionnaire is closed": "ეს გამოკითხვა დახურულია.",
    "this device already submitted its answers": "ამ ტელეფონიდან პასუხები უკვე გაიგზავნა.",
    "required questions are not answered": "სავალდებულო კითხვები შეუვსებელია.",
    "the response changed in another window — reload": "პასუხები სხვა ფანჯარაში შეიცვალა — განაახლეთ გვერდი.",
    "something went wrong — reload and try again": "მოხდა შეცდომა — განაახლეთ გვერდი და სცადეთ თავიდან.",
    "this link does not exist": "ასეთი ბმული არ არსებობს.",
    "this link is not valid": "ბმული არასწორია."
  };
  function trErr(m) {
    m = String(m || "");
    return (lang === "ka" && SRV_KA[m]) || m;
  }
  /* Team names, shown in Georgian inside the Georgian banners. DISPLAY ONLY — the stored
     category never changes, same rule as answers. Unknown names pass through. */
  var TEAM_KA = {
    "Drivers": "მძღოლები", "Helpers": "დამხმარეები", "Foremen": "ფორმანები",
    "Sales Representatives": "გაყიდვების გუნდი", "Support Team": "მხარდაჭერის გუნდი",
    "Other": "სხვა განყოფილებები"
  };
  function trTeam(c) {
    c = String(c || "");
    return (lang === "ka" && TEAM_KA[c]) || c;
  }

  var LKEY = "hrq_lang";
  // GEORGIAN IS THE DEFAULT (his call 2026-08-17): the crew reads Georgian first, and a
  // form that opens in the wrong language is a form half the team skims. English stays one
  // click away, and a chosen language sticks in this browser.
  var lang = store.get(LKEY);
  if (lang !== "ka" && lang !== "en") lang = "ka";
  var L = function () { return STR[lang]; };
  // the questionnaire's own words: translated when present, English when not
  function tx(obj, field) {
    var i = obj && obj.i18n && obj.i18n[lang];
    return (i && i[field]) || obj[field] || "";
  }
  // a CHOICE label: translated for display, but the value we store never changes
  function tOpt(qq, o) {
    var i = qq && qq.i18n && qq.i18n[lang];
    if (o === OTH) return (i && i.other) || (lang === "ka" ? "სხვა…" : OTH);
    return (i && i.opt && i.opt[o]) || o;
  }
  function tScale(qq, which, fallback) {
    var i = qq && qq.i18n && qq.i18n[lang];
    return (i && i[which]) || fallback || "";
  }
  function paintLang() {
    var box = document.getElementById("lang");
    if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b.dataset.l === lang);
      b.onclick = function () {
        if (lang === b.dataset.l) return;
        lang = b.dataset.l; store.set(LKEY, lang);
        document.documentElement.lang = lang;
        paintLang(); if (Q) paint();
      };
    });
  }
  paintLang();
  document.documentElement.lang = lang;

  /* The link gate lives BELOW the language table on purpose: it used to sit 90 lines above
     it, where L() was still undefined — so the one screen written for a broken link died in
     a TypeError and the reader got an eternal "Loading…". Links get forwarded and mangled;
     this screen has to be the sturdiest one on the page. */
  // team tokens read "<team-slug>-<8hex>" (legacy 32-hex links pass the same shape)
  if (!/^[a-z0-9][a-z0-9-]{7,95}$/.test(t)) {
    main.innerHTML = '<div class="card"><b>' + L().bad + "</b>" +
      '<div class="dim" style="margin-top:6px">' + L().badSub + "</div></div>";
    return;
  }
  // the browser's own random id — resume/autosave continuity, never an identity
  var cidKey = "hrq_anon_" + t;
  var cid = store.get(cidKey) || "";
  if (!/^[a-f0-9]{32}$/.test(cid)) {
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    cid = Array.prototype.map.call(b, function (x) {
      return ("0" + x.toString(16)).slice(-2); }).join("");
    store.set(cidKey, cid);
  }

  var Q = null, step = -1, seq = {}, chain = {}, okv = {};

  function api(opts) {
    return fetch(API + "/api/_hrqanon" + (opts && opts.body ? "" :
      "?t=" + t + "&cid=" + cid), Object.assign({
      headers: (opts && opts.body) ? { "Content-Type": "application/json" } : {},
    }, opts || {})).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) { var e = new Error(j.error || ("HTTP " + r.status)); e.deep = j; throw e; }
        return j;
      });
    });
  }
  function savePost(body) {
    body.t = t; body.cid = cid;
    return fetch(API + "/api/_hrqanon", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
        return j; }); });
  }

  function buildSteps() {
    var steps = [], cur = null, num = 0;
    Q.questions.forEach(function (qq) {
      if (qq.qtype === "section") {
        cur = { title: tx(qq, "label"), desc: tx(qq, "description"), items: [] };
        steps.push(cur);
      } else {
        num += 1;
        if (!cur) { cur = { title: "", desc: "", items: [] }; steps.push(cur); }
        qq._num = num;
        cur.items.push(qq);
      }
    });
    return steps.filter(function (s) { return s.items.length; });
  }
  function answered(qq) { var v = Q.answers[qq.id]; return v != null && v !== ""; }
  function counts(steps) {
    var a = 0, tt = 0;
    steps.forEach(function (s) { s.items.forEach(function (it) { tt++; if (answered(it)) a++; }); });
    return { a: a, t: tt };
  }
  function progBar(a, tt) {
    return '<div class="pb"><i id="pbi" style="width:' + (tt ? Math.round(a / tt * 100) : 0) + '%"></i></div>';
  }
  function safeArr(v) {
    if (v == null || v === "") return [];
    try { var a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }

  /* HIS ASK 2026-08-27: "some people forget to finalize the form yet its mostly filled".
     Answers autosave, so nothing is LOST on close — but an unsubmitted form never reaches
     the results. The browser's own leave-confirmation is the only popup allowed at close
     time, so it fires whenever there is at least one answer and no submit yet. Preview
     links are exempt: nothing they enter is ever written, so there is nothing to lose. */
  window.addEventListener("beforeunload", function (e) {
    try {
      if (!Q || Q.preview) return;
      if (Q.my_status === "submitted" || Q.my_status === "resubmitted") return;
      if (!counts(buildSteps()).a) return;
      e.preventDefault();
      e.returnValue = "";
    } catch (err) { /* the guard must never break the form itself */ }
  });

  function paint() {
    var steps = buildSteps();
    if (Q.my_status === "submitted" || Q.my_status === "resubmitted") return paintDone();
    if (step === -1) return paintIntro(steps);
    if (step >= steps.length) return paintReview(steps);
    paintStep(steps, step);
  }

  function paintDone() {
    main.innerHTML = '<div class="card sect-done"><span class="big">✓</span>' +
      "<b>" + (Q.preview ? L().donePvT : L().doneT) + "</b>" +
      '<div class="dim" style="margin-top:8px">' +
      (Q.preview ? L().donePvS : L().doneS(esc(Q.category))) + "</div></div>";
  }

  function paintIntro(steps) {
    var p = counts(steps);
    main.innerHTML =
      '<div class="card" style="padding:26px 26px">' +
      '<b style="font-size:21px;letter-spacing:-.3px">' + esc(tx(Q, "title")) + "</b>" +
      (tx(Q, "description") ? '<div style="font-size:13.5px;color:var(--muted);margin-top:9px;line-height:1.6">' + esc(tx(Q, "description")) + "</div>" : "") +
      '<div class="meta">' + L().parts(steps.length) + " · " + L().qs(p.t) + " · " +
      L().saveNote + "</div>" +
      (tx(Q, "instructions") ? '<div style="font-size:13px;margin-top:13px;line-height:1.65">' + esc(tx(Q, "instructions")) + "</div>" : "") +
      '<div class="anon">' + (Q.preview ? L().prevNote : L().anon(esc(Q.category))) + "</div>" +
      (p.a ? '<div style="margin-top:16px">' + progBar(p.a, p.t) +
        '<span class="dim" id="cnt">' + L().answered(p.a, p.t) + "</span></div>" : "") +
      '<div style="margin-top:20px"><button class="go" id="start">' +
      (p.a >= p.t && p.t ? L().reviewGo : p.a ? L().resume : L().start) +
      "</button></div></div>";
    document.getElementById("start").onclick = function () {
      var at = steps.length;
      for (var i = 0; i < steps.length; i++)
        if (steps[i].items.some(function (it) { return !answered(it); })) { at = i; break; }
      step = at; paint(); window.scrollTo(0, 0);
    };
  }

  function qCard(qq) {
    var v = Q.answers[qq.id];
    var inner;
    if (qq.qtype === "stars5") {
      inner = '<div class="stars" data-q="' + qq.id + '">' +
        [1, 2, 3, 4, 5].map(function (n) {
          return '<button class="star' + (v != null && v !== "" && n <= +v ? " on" : "") +
            '" data-s="' + n + '">★</button>';
        }).join("") + "</div>";
    } else if (qq.qtype === "scale") {
      var lo = parseInt((qq.options || [])[0], 10); if (isNaN(lo)) lo = 1;
      var hi = parseInt((qq.options || [])[1], 10); if (isNaN(hi)) hi = 5;
      var btns = [];
      for (var sc = lo; sc <= hi; sc++)
        btns.push('<button class="num' + (v != null && v !== "" && +v === sc ? " on" : "") +
          '" data-sc="' + qq.id + '" data-v="' + sc + '">' + sc + "</button>");
      var l1 = tScale(qq, "lo", (qq.options || [])[2]);
      var l2 = tScale(qq, "hi", (qq.options || [])[3]);
      inner = '<div class="scale">' + btns.join("") + "</div>" +
        (l1 || l2 ? '<div class="scalelab"><span>' + esc(l1 || "") + "</span><span>" +
          esc(l2 || "") + "</span></div>" : "");
    } else if (qq.qtype === "single") {
      var isOthS = v != null && String(v).indexOf("Other: ") === 0;
      inner = (qq.options || []).map(function (o) {
        var isO = o === OTH;
        var on = isO ? isOthS : v === o;
        return '<label class="choice' + (on ? " on" : "") + '"><input type="radio" name="q' + qq.id + '"' +
          (on ? " checked" : "") + ' data-q="' + qq.id + '" data-o="' + esc(o) + '"' +
          (isO ? ' data-oth="1"' : "") + ">" +
          (isO ? '<span style="display:flex;gap:8px;flex:1;align-items:center">' + L().other +
                 '<input class="oth" data-so="' + qq.id + '" value="' +
                 (isOthS ? esc(String(v).slice(7)) : "") + '"></span>'
               : "<span>" + esc(tOpt(qq, o)) + "</span>") + "</label>";
      }).join("");
    } else if (qq.qtype === "multi") {
      var picked = new Set(safeArr(v));
      var othVal = "";
      picked.forEach(function (x) { if (String(x).indexOf("Other: ") === 0) othVal = String(x).slice(7); });
      inner = (qq.options || []).map(function (o) {
        var isO = o === OTH;
        var on = isO ? !!othVal : picked.has(o);
        return '<label class="choice' + (on ? " on" : "") + '"><input type="checkbox"' +
          (on ? " checked" : "") + ' data-mq="' + qq.id + '" data-o="' + esc(o) + '"' +
          (isO ? ' data-oth="1"' : "") + ">" +
          (isO ? '<span style="display:flex;gap:8px;flex:1;align-items:center">' + L().other +
                 '<input class="oth" data-mo="' + qq.id + '" value="' + esc(othVal) + '"></span>'
               : "<span>" + esc(tOpt(qq, o)) + "</span>") + "</label>";
      }).join("");
    } else if (qq.qtype === "dropdown") {
      var isOthD = v != null && String(v).indexOf("Other: ") === 0;
      inner = '<select class="sel" data-dd="' + qq.id + '">' +
        '<option value=""' + (v == null || v === "" ? " selected" : "") + ">" + L().choose + "</option>" +
        (qq.options || []).map(function (o) {
          var on = o === OTH ? isOthD : v === o;
          return '<option value="' + esc(o) + '"' + (on ? " selected" : "") + ">" +
            esc(tOpt(qq, o)) + "</option>";
        }).join("") + "</select>" +
        '<div style="margin-top:8px;display:' + (isOthD ? "flex" : "none") +
        ';gap:8px;align-items:center" data-ddrow="' + qq.id + '">' +
        '<span style="font-size:13px">' + L().other + "</span>" +
        '<input class="oth" style="max-width:320px" data-ddo="' + qq.id + '" value="' +
        (isOthD ? esc(String(v).slice(7)) : "") + '"></div>';
    } else {
      var max = qq.qtype === "short_text" ? 300 : 5000;
      inner = '<textarea class="ta" data-t="' + qq.id + '" maxlength="' + max + '" rows="' +
        (qq.qtype === "short_text" ? 2 : 5) + '" placeholder="' + L().yourAnswer + '">' + esc(v || "") + "</textarea>" +
        '<div class="ct" data-ct="' + qq.id + '">' + String(v || "").length + " / " + max + "</div>";
    }
    return '<div class="q" data-qq="' + qq.id + '"><div class="lab">' + qq._num + ". " + esc(tx(qq, "label")) +
      (qq.required ? '<u title="' + L().required + '">*</u>' : ' <span class="opt">' + L().optional + "</span>") + "</div>" +
      (tx(qq, "description") ? '<div class="desc">' + esc(tx(qq, "description")) + "</div>" : "") +
      (qq.qtype === "long_text" ? '<div class="desc" style="color:var(--faint)">' + L().fewSentences + "</div>" : "") +
      '<div class="body">' + inner + '</div><div class="saved" data-sv="' + qq.id + '"></div></div>';
  }

  function paintStep(steps, si) {
    var s = steps[si], p = counts(steps);
    main.innerHTML =
      '<div class="top"><span>' + (Q.preview ? L().topPrev : L().topAnon(esc(Q.category))) + "</span>" +
      '<span style="flex:1"></span><span id="cnt">' + L().answered(p.a, p.t) + "</span></div>" +
      progBar(p.a, p.t) +
      '<div class="part"><span class="pn">' + L().partOf(si + 1, steps.length) + "</span>" +
      "<b>" + esc(s.title || tx(Q, "title")) + "</b>" +
      (s.desc ? '<div class="pd">' + esc(s.desc) + "</div>" : "") + "</div>" +
      s.items.map(qCard).join("") +
      '<div class="navbar"><button class="btn" id="prev">' + (si === 0 ? L().intro : L().back) + "</button>" +
      '<span style="flex:1"></span>' +
      '<button class="go" id="next" style="padding:11px 24px">' +
      (si === steps.length - 1 ? L().reviewNext : L().next) + "</button></div>";
    document.getElementById("prev").onclick = function () { step = si - 1; paint(); window.scrollTo(0, 0); };
    document.getElementById("next").onclick = function () { step = si + 1; paint(); window.scrollTo(0, 0); };
    wire();
  }

  function paintReview(steps) {
    var p = counts(steps);
    var rows = steps.map(function (s, i) {
      var tt = s.items.length, a = 0, reqMiss = 0;
      s.items.forEach(function (it) { if (answered(it)) a++; else if (it.required) reqMiss++; });
      return '<div class="rrow' + (reqMiss ? " miss" : "") + '" data-go="' + i + '">' +
        '<span class="tick">' + (reqMiss ? "!" : (a === tt ? "✓" : "…")) + "</span>" +
        "<b>" + esc(s.title || tx(Q, "title")) + "</b>" +
        '<span class="dim">' + L().answered(a, tt) +
        (reqMiss ? L().missReq(reqMiss) : "") + "</span>" +
        '<span style="flex:1"></span><span class="dim">' + L().open + "</span></div>";
    });
    main.innerHTML =
      '<div class="top"><span>' + (Q.preview ? L().topPrev : L().topAnon(esc(Q.category))) + "</span>" +
      '<span style="flex:1"></span><span id="cnt">' + L().answered(p.a, p.t) + "</span></div>" +
      progBar(p.a, p.t) +
      '<div class="part"><span class="pn">' + L().review + "</span><b>" + L().ready + "</b>" +
      '<div class="pd">' + (Q.preview ? L().reviewNotePv : L().reviewNote) + "</div></div>" +
      '<div class="card" style="padding:8px 10px">' + rows.join("") + "</div>" +
      '<div class="navbar"><button class="btn" id="prev">' + L().back + "</button>" +
      '<span class="err" id="err"></span><span style="flex:1"></span>' +
      '<button class="go" id="submit">' + L().submit + "</button></div>";
    document.getElementById("prev").onclick = function () { step -= 1; paint(); window.scrollTo(0, 0); };
    Array.prototype.forEach.call(main.querySelectorAll("[data-go]"), function (r) {
      r.onclick = function () { step = +r.dataset.go; paint(); window.scrollTo(0, 0); };
    });
    document.getElementById("submit").onclick = function () {
      var missing = [];
      Q.questions.forEach(function (qq) {
        if (qq.qtype === "section" || !qq.required) return;
        var v = Q.answers[qq.id];
        if (v == null || v === "" || (qq.qtype === "multi" && !safeArr(v).length)) missing.push(qq);
      });
      if (missing.length) {
        var steps2 = buildSteps();
        for (var i = 0; i < steps2.length; i++)
          if (steps2[i].items.some(function (x) { return x.id === missing[0].id; })) { step = i; break; }
        paint();
        var first = main.querySelector('[data-qq="' + missing[0].id + '"]');
        if (first) { first.classList.add("missb"); first.scrollIntoView({ block: "center" }); }
        return;
      }
      var btn = document.getElementById("submit");
      btn.disabled = true; btn.textContent = L().submitting;
      // the server saw NOTHING until now — push every locally-held answer, then finalize.
      // A preview still pushes nothing: its answers are never recorded anywhere.
      var push = Promise.resolve();
      if (!Q.preview) Object.keys(Q.answers || {}).forEach(function (k) {
        var v = Q.answers[k];
        if (v == null || v === "") return;
        // multi answers are stored as JSON strings; the API expects the array back
        if (typeof v === "string" && v.charAt(0) === "[") {
          try { v = JSON.parse(v); } catch (e2) {}
        }
        push = push.then(function () {
          return savePost({ question_id: +k, value: v });
        });
      });
      push.then(function () {
        return savePost({ submit: true });
      }).then(function () {
        Q.my_status = "submitted";
        try { store.set(draftKey, ""); } catch (e3) {}
        paint(); window.scrollTo(0, 0);
      }, function (e) {
        btn.disabled = false; btn.textContent = L().submit;
        document.getElementById("err").textContent = trErr(e.message);
      });
    };
  }

  /* Save one answer LOCALLY — memory + the device draft, never the server (his call
     2026-08-28: an unsubmitted response must not exist anywhere HR can see it). The
     whole set is pushed when Submit is pressed; server rows therefore only ever hold
     submitted answers. A preview writes nothing anywhere, as before. */
  var draftKey = "hrq_draft_" + t;
  function draftWrite() {
    if (!Q || Q.preview) return;
    try { store.set(draftKey, JSON.stringify(Q.answers || {})); } catch (e) {}
  }
  function save(qid, value) {
    var stored = Array.isArray(value) ? JSON.stringify(value) : value;
    Q.answers[qid] = stored;
    draftWrite();
    var sv = main.querySelector('[data-sv="' + qid + '"]');
    if (sv) { sv.textContent = L().saved; sv.style.color = "var(--pos)"; }
    var steps = buildSteps(), p = counts(steps);
    var pbi = document.getElementById("pbi"), cnt = document.getElementById("cnt");
    if (pbi) pbi.style.width = (p.t ? Math.round(p.a / p.t * 100) : 0) + "%";
    if (cnt) cnt.textContent = L().answered(p.a, p.t);
  }

  function wire() {
    Array.prototype.forEach.call(main.querySelectorAll(".stars"), function (w) {
      var qid = +w.dataset.q;
      Array.prototype.forEach.call(w.querySelectorAll(".star"), function (b) {
        b.onclick = function () {
          save(qid, +b.dataset.s);
          Array.prototype.forEach.call(w.querySelectorAll(".star"), function (s2) {
            s2.classList.toggle("on", +s2.dataset.s <= +b.dataset.s);
          });
        };
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll("button[data-sc]"), function (b) {
      b.onclick = function () {
        save(+b.dataset.sc, +b.dataset.v);
        var wrap = b.closest(".scale");
        Array.prototype.forEach.call(wrap.querySelectorAll(".num"), function (x) {
          x.classList.toggle("on", x === b);
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll('input[type="radio"][data-q]'), function (r) {
      r.onchange = function () {
        var card = r.closest(".q");
        if (r.dataset.oth) {
          var oi = card.querySelector("input[data-so]");
          if (oi && oi.value.trim()) save(+r.dataset.q, "Other: " + oi.value.trim());
          else if (oi) oi.focus();
        } else save(+r.dataset.q, r.dataset.o);
        Array.prototype.forEach.call(card.querySelectorAll(".choice"), function (c) {
          c.classList.toggle("on", c.querySelector("input").checked);
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("input[data-so]"), function (oi) {
      var qid = +oi.dataset.so, tm = null;
      var push = function () { if (oi.value.trim()) save(qid, "Other: " + oi.value.trim()); };
      oi.oninput = function () {
        var radio = oi.closest(".choice").querySelector("input[data-oth]");
        if (radio && !radio.checked) { radio.checked = true; oi.closest(".choice").classList.add("on"); }
        clearTimeout(tm); tm = setTimeout(push, 900);
      };
      oi.onblur = function () { clearTimeout(tm); push(); };
    });
    function multiVals(card) {
      var vals = [];
      Array.prototype.forEach.call(card.querySelectorAll("input[data-mq]:checked"), function (x) {
        if (x.dataset.oth) {
          var oi = card.querySelector("input[data-mo]");
          if (oi && oi.value.trim()) vals.push("Other: " + oi.value.trim());
        } else vals.push(x.dataset.o);
      });
      return vals;
    }
    Array.prototype.forEach.call(main.querySelectorAll("input[data-mq]"), function (c) {
      c.onchange = function () {
        var qid = +c.dataset.mq, card = c.closest(".q");
        if (c.dataset.oth && c.checked) {
          var oi = card.querySelector("input[data-mo]");
          if (oi && !oi.value.trim()) { oi.focus(); return; }
        }
        save(qid, multiVals(card));
        Array.prototype.forEach.call(card.querySelectorAll(".choice"), function (ch) {
          ch.classList.toggle("on", ch.querySelector("input").checked);
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("input[data-mo]"), function (oi) {
      var qid = +oi.dataset.mo, tm = null, card = oi.closest(".q");
      var push = function () {
        var cb = oi.closest(".choice").querySelector("input[data-oth]");
        if (cb && !cb.checked && oi.value.trim()) { cb.checked = true; oi.closest(".choice").classList.add("on"); }
        if (oi.value.trim()) save(qid, multiVals(card));
      };
      oi.oninput = function () { clearTimeout(tm); tm = setTimeout(push, 900); };
      oi.onblur = function () { clearTimeout(tm); push(); };
    });
    Array.prototype.forEach.call(main.querySelectorAll("select[data-dd]"), function (dd) {
      var qid = +dd.dataset.dd;
      var row = main.querySelector('[data-ddrow="' + qid + '"]');
      dd.onchange = function () {
        var v = dd.value;
        if (v === OTH) {
          if (row) { row.style.display = "flex"; row.querySelector("input").focus(); }
          var oi = row && row.querySelector("input");
          if (oi && oi.value.trim()) save(qid, "Other: " + oi.value.trim());
        } else {
          if (row) row.style.display = "none";
          save(qid, v);
        }
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("input[data-ddo]"), function (oi) {
      var qid = +oi.dataset.ddo, tm = null;
      var push = function () { if (oi.value.trim()) save(qid, "Other: " + oi.value.trim()); };
      oi.oninput = function () { clearTimeout(tm); tm = setTimeout(push, 900); };
      oi.onblur = function () { clearTimeout(tm); push(); };
    });
    Array.prototype.forEach.call(main.querySelectorAll("textarea[data-t]"), function (ta) {
      var qid = +ta.dataset.t, tm = null;
      var ct = main.querySelector('[data-ct="' + qid + '"]');
      var max = +ta.maxLength;
      ta.oninput = function () {
        if (ct) ct.textContent = ta.value.length + " / " + max;
        clearTimeout(tm);
        tm = setTimeout(function () { save(qid, ta.value); }, 900);
      };
      ta.onblur = function () { clearTimeout(tm); save(qid, ta.value); };
    });
  }

  api().then(function (j) {
    Q = j;
    // resume the device draft over whatever the server holds (legacy autosaved rows
    // still return their answers; the draft is newer, so it wins per question)
    if (!Q.preview && Q.my_status !== "submitted" && Q.my_status !== "resubmitted") {
      try {
        var d = JSON.parse(store.get(draftKey) || "null");
        if (d && typeof d === "object") {
          Q.answers = Q.answers || {};
          Object.keys(d).forEach(function (k) { Q.answers[k] = d[k]; });
        }
      } catch (e) {}
    }
    paint();
  }, function (e) {
    main.innerHTML = '<div class="card"><b>' + esc(trErr(e.message)) + "</b>" +
      '<div class="dim" style="margin-top:6px">' + L().badSub + "</div></div>";
  });
})();
</script>
</body>
</html>

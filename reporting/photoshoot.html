<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photoshoot Confirmation · Zip To Zip</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Redesigned 2026-10-07 in the portal's own look ("Calm finance", assets/rs.css light.v2): the same
   page serves photographers (public link, no login) and the office (embedded in the portal under
   Marketing Automations, ?embed=1 hides this page's own header). His call: everyone sees
   everything, including the "why the list is short" funnel and who booked a day. Data and the
   one-shoot-per-day rule are the bridge's (/api/_photo, bridge/photoshoot.py). */
:root{--bg:#F6F7F9;--panel:#FFFFFF;--panel-2:#F8FAFC;--line:#E2E8F0;--line-2:#CBD5E1;--ink:#0F172A;--muted:#475569;--faint:#64748B;
  --brand:#3F7D20;--brand-d:#14301F;--blue-bg:#F4FAE6;--pos:#15803D;--pos-bg:#DCFCE7;--warn:#B45309;--warn-bg:#FEF3C7;--neg:#B91C1C;--neg-bg:#FEE2E2}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.embed{background:transparent}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px}
.top img{height:28px;display:block}
.top h1{font-size:17px;font-weight:600;margin:0}
.top .sub{margin-left:auto;font-size:12px;color:var(--faint)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
body.embed .wrap{padding:0 0 30px;max-width:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi .l{font-size:12px;color:var(--faint)}
.kpi .v{font-size:22px;font-weight:600;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.neg .v{color:var(--neg)}.kpi.pos .v{color:var(--pos)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:14px;font-weight:600;margin:0}
.ph .rt{margin-left:auto;font-size:12px;color:var(--faint)}
.fun{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.fun .t{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fun .t i{display:block;height:100%;background:#C9E68A}
.fun .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.fun.last .t i{background:var(--brand)}.fun.zero .n{color:var(--neg)}
.fun.off{color:var(--faint)}.fun.off .t i{background:var(--line)}
.note{font-size:12px;color:var(--faint);margin-top:8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center;font-size:11.5px;color:var(--faint);background:#fff;min-height:58px;cursor:default}
.day b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.day.has{background:var(--blue-bg);border-color:#DCEFB0;color:var(--brand-d);cursor:pointer}
.day.ok{background:var(--pos-bg);border-color:#86EFAC;color:var(--pos)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day .w{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.day .x{display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .lab{font-size:12px;color:var(--faint);margin-left:6px}
.chip{font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line-2);background:#fff;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--blue-bg);border-color:#C9E68A;color:var(--brand-d)}
.dh{display:flex;align-items:center;gap:8px;padding:14px 2px 6px;font-weight:600;font-size:13px}
.dh .bd{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.dh .bd.today{background:var(--blue-bg);border-color:#DCEFB0;color:var(--brand-d)}
.dh .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.dh .bk{font-size:12px;color:var(--pos);font-weight:500}
.row{display:grid;grid-template-columns:70px minmax(0,1fr) 150px 210px;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.row .tm{font-weight:600;font-variant-numeric:tabular-nums}
.row .tm small{display:block;font-size:11px;color:var(--faint);font-weight:500}
.row .cu{font-weight:600}
.row .cu a{color:var(--ink);text-decoration:none}.row .cu a:hover{color:var(--brand);text-decoration:underline}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.tag.yes{background:var(--pos-bg);border-color:#86EFAC;color:var(--pos)}
.tag.cl{background:var(--blue-bg);border-color:#DCEFB0;color:var(--brand-d)}
.row .ad{display:block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ad:hover{color:var(--brand)}
.row .fo{font-size:12px;color:var(--pos);margin-top:3px}
.row .fo a{color:var(--pos)}
.row .me{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row .me b{color:var(--ink);font-weight:600}
.row .ac{text-align:right}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line-2);background:#fff;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn[disabled]{opacity:.55;cursor:default}
.booked{font-size:12.5px;color:var(--pos);font-weight:600}
.booked small{display:block;font-weight:500;color:var(--faint)}
.lnk{font:inherit;font-size:12px;background:none;border:0;color:var(--neg);text-decoration:underline;cursor:pointer;padding:0;margin-top:2px}
.taken{font-size:12.5px;color:var(--faint)}
.empty{background:#fff;border:1px dashed var(--line-2);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.loading{padding:60px;text-align:center;color:var(--faint)}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:14px;max-width:400px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.dlg h3{margin:0 0 10px;font-size:16px}
.dlg .bx{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.dlg .bx b{color:var(--ink)}
.dlg p{font-size:12.5px;color:var(--muted);margin:12px 0}
.dlg label{font-size:12px;color:var(--faint);display:block;margin-bottom:4px}
.dlg input{font:inherit;width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.dlg input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(63,125,32,.14)}
.dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn.neg{background:var(--neg);border-color:var(--neg);color:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:92vw}
#toast.show{opacity:1}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:56px minmax(0,1fr);}.row .me{grid-column:2;text-align:left}.row .ac{grid-column:1 / -1;text-align:left}}
</style>
</head>
<body>
<div class="top" id="top"><div class="top-in"><img src="logo.png" alt="Zip To Zip" onerror="this.remove()"><h1>Photoshoot Confirmation</h1><span class="sub">From the move calendar · refreshed hourly</span></div></div>
<div class="wrap"><div id="out"><div class="loading">Loading photoshoots…</div></div></div>
<div id="toast"></div>
<script>
var API = 'https://ztz-bridge-32168089642.us-east4.run.app/api/_photo';
var EMBED = /[?&]embed=1\b/.test(location.search);
if (EMBED) { document.body.classList.add('embed'); document.getElementById('top').remove(); }
var MIN_CF = 1000, MAX_MI = 50, STATES = ['NJ', 'NY', 'CT'];
var F = { dist: true, cf: true, app: true, st: new Set(STATES) };
var D = null, BUSY = {};
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function $(s) { return document.querySelector(s); }
function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 4000); }
function n0(v) { return Math.round(v || 0).toLocaleString('en-US'); }
function fmt12(min) { if (min == null) return ''; var h = Math.floor(min / 60), m = min % 60; return (h % 12 || 12) + ':' + ('0' + m).slice(-2) + ' ' + (h < 12 ? 'AM' : 'PM'); }
function dObj(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function addDays(iso, n) { return new Date(dObj(iso).getTime() + n * 864e5).toISOString().slice(0, 10); }
function dayLabel(iso) { var d = dObj(iso); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; }
function who(email) { email = String(email || ''); return email ? email.split('@')[0] : 'someone'; }
function photogEmail() { try { return localStorage.getItem('zd_photog_email') || ''; } catch (e) { return ''; } }
function setPhotog(e) { try { localStorage.setItem('zd_photog_email', e); } catch (_) {} }
function validEmail(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e || '').trim()); }
function mapsLink(a) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a || ''); }
function telHref(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 10) d = '1' + d; return d ? 'tel:+' + d : ''; }

/* the rules, in the order the funnel shows them (photo.html's own rules) */
var STEPS = [
  { k: 'st', lab: function () { return 'In ' + ([...F.st].join(', ') || 'no state'); }, on: function () { return true; }, ok: function (j) { return F.st.has(j.puState); } },
  { k: 'dist', lab: function () { return 'Within ' + MAX_MI + ' mi of base'; }, on: function () { return F.dist; }, ok: function (j) { return j.dist != null && j.dist <= MAX_MI; } },
  { k: 'cf', lab: function () { return n0(MIN_CF) + ' CF or more'; }, on: function () { return F.cf; }, ok: function (j) { return (j.cf || 0) >= MIN_CF; } },
  { k: 'app', lab: function () { return 'Approved by sales'; }, on: function () { return F.app; }, ok: function (j) { return !(j.recent && j.flag !== 'YES'); } }
];
function upcoming() { return (D.jobs || []).filter(function (j) { return j.date && j.date >= D.today; }); }
function shootable() { return upcoming().filter(function (j) { return STEPS.every(function (s) { return !s.on() || s.ok(j); }); }); }

function load(quiet) {
  return fetch(API, { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }); })
    .then(function (j) { D = j; D.confirmed = D.confirmed || {}; D.booked_by = D.booked_by || {}; render(); })
    .catch(function () { if (!quiet || !D) $('#out').innerHTML = '<div class="empty"><b>Couldn’t load photoshoots</b>Refresh the page to try again.</div>'; });
}

function render() {
  var up = upcoming(), sh = shootable();
  var booked14 = 0, next = null;
  for (var i = 0; i < 14; i++) { if (D.confirmed[addDays(D.today, i)]) booked14++; }
  Object.keys(D.confirmed).sort().some(function (d) { if (d >= D.today) { next = d; return true; } return false; });
  var nextJob = next ? up.filter(function (j) { return j.date === next && j.code === D.confirmed[next]; })[0] : null;
  var h = '<div class="kpis">'
    + '<div class="kpi"><div class="l">Upcoming Zip to Zip jobs</div><div class="v">' + n0(up.length + (D.flagged_no || 0)) + '</div><div class="s">' + n0(D.flagged_no || 0) + ' marked “no photos” by sales</div></div>'
    + '<div class="kpi ' + (sh.length ? 'pos' : 'neg') + '"><div class="l">Shootable with these filters</div><div class="v">' + n0(sh.length) + '</div><div class="s">' + (sh.length ? 'ready to confirm' : 'see why below') + '</div></div>'
    + '<div class="kpi"><div class="l">Days booked, next 14</div><div class="v">' + booked14 + '</div><div class="s">one photographer per day</div></div>'
    + '<div class="kpi"><div class="l">Next shoot</div><div class="v">' + (next ? esc(dayLabel(next)) : '—') + '</div><div class="s">' + (next ? esc((nextJob && nextJob.customer) || D.confirmed[next]) + ' · ' + esc(who((D.booked_by[next] || {}).email)) : 'nothing booked yet') + '</div></div>'
    + '</div>';

  // why the list is short
  var left = up.length, fun = '<div class="fun"><span>Upcoming jobs</span><span class="t"><i style="width:100%"></i></span><span class="n">' + n0(up.length) + '</span></div>';
  var pool = up.slice();
  STEPS.forEach(function (s, ix) {
    var on = s.on();
    if (on) pool = pool.filter(s.ok);
    var last = ix === STEPS.length - 1;
    fun += '<div class="fun' + (on ? '' : ' off') + (last ? ' last' : '') + (on && !pool.length ? ' zero' : '') + '"><span>' + esc(s.lab()) + (on ? '' : ' <small>(off)</small>') + '</span><span class="t"><i style="width:' + (up.length ? (pool.length / up.length * 100).toFixed(1) : 0) + '%"></i></span><span class="n">' + n0(pool.length) + '</span></div>';
  });
  var yes = up.filter(function (j) { return j.flag === 'YES'; }).length;
  fun += '<div class="note">' + n0(D.flagged_no || 0) + ' upcoming jobs are marked “Allowed Photo Shooting: NO” and never show. ' + n0(yes) + ' are marked YES. Jobs booked before 25 Jun 2026 don’t need the flag.</div>';

  // the next 14 days
  var strip = '';
  for (var k = 0; k < 14; k++) {
    var d = addDays(D.today, k), dd = dObj(d), c = D.confirmed[d], nJobs = sh.filter(function (j) { return j.date === d; }).length;
    var cls = c ? 'ok' : (nJobs ? 'has' : ''), x = c ? 'booked · ' + who((D.booked_by[d] || {}).email) : (nJobs ? nJobs + (nJobs === 1 ? ' job' : ' jobs') : '—');
    strip += '<div class="day ' + cls + (k === 0 ? ' today' : '') + '"' + (nJobs || c ? ' data-goto="' + d + '"' : '') + ' title="' + esc(dayLabel(d)) + '"><span class="w">' + DOW[dd.getUTCDay()] + '</span><b>' + dd.getUTCDate() + '</b><span class="x">' + esc(x) + '</span></div>';
  }
  h += '<div class="grid2"><div class="panel"><div class="ph"><h2>Why the list is short</h2><span class="rt">each rule, in order</span></div>' + fun + '</div>'
    + '<div class="panel"><div class="ph"><h2>Next 14 days</h2><span class="rt">green = a photographer is booked</span></div><div class="days">' + strip + '</div></div></div>';

  // filters + list
  var states = {}; up.forEach(function (j) { if (j.puState) states[j.puState] = 1; });
  var sl = Object.keys(states).sort(function (a, b) { var ia = STATES.indexOf(a), ib = STATES.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
  h += '<div class="panel"><div class="ph"><h2>Jobs to shoot</h2><span class="rt">' + n0(sh.length) + ' of ' + n0(up.length) + ' upcoming</span></div>'
    + '<div class="bar">' + sl.map(function (s) { return '<button class="chip' + (F.st.has(s) ? ' on' : '') + '" data-st="' + esc(s) + '">' + esc(s) + '</button>'; }).join('')
    + '<span class="lab">Rules</span>'
    + '<button class="chip' + (F.dist ? ' on' : '') + '" data-f="dist">≤ ' + MAX_MI + ' mi</button>'
    + '<button class="chip' + (F.cf ? ' on' : '') + '" data-f="cf">≥ ' + n0(MIN_CF) + ' CF</button>'
    + '<button class="chip' + (F.app ? ' on' : '') + '" data-f="app">Approved only</button></div>';
  if (!sh.length) {
    h += '<div class="empty"><b>Nothing to shoot with these rules</b>' + (F.app && !yes ? 'No upcoming job is approved by sales yet — turn “Approved only” off to see the rest.' : 'Turn a rule off or add a state to see more jobs.') + '</div>';
  } else {
    sh.sort(function (a, b) { return a.date.localeCompare(b.date) || ((a.tmin == null ? 9999 : a.tmin) - (b.tmin == null ? 9999 : b.tmin)) || ((a.dist || 0) - (b.dist || 0)); });
    var cur = null;
    sh.forEach(function (j) {
      if (j.date !== cur) {
        cur = j.date;
        var n = sh.filter(function (x) { return x.date === cur; }).length, c = D.confirmed[cur], bd = cur === D.today ? 'Today' : (cur === addDays(D.today, 1) ? 'Tomorrow' : '');
        h += '<div class="dh" id="d-' + cur + '">' + esc(dayLabel(cur)) + (bd ? '<span class="bd today">' + bd + '</span>' : '')
          + (c ? '<span class="bk">· booked by ' + esc(who((D.booked_by[cur] || {}).email)) + '</span>' : '') + '<span class="cnt">' + n + (n === 1 ? ' job' : ' jobs') + '</span></div>';
      }
      h += row(j);
    });
  }
  h += '</div>';
  $('#out').innerHTML = h;
}

function row(j) {
  var k = j.code + '|' + j.date, mine = D.confirmed[j.date], by = D.booked_by[j.date] || {};
  var tag = j.flag === 'YES' ? '<span class="tag yes">Approved</span>' : (j.recent ? '<span class="tag">Not flagged</span>' : '<span class="tag">Booked before 25 Jun</span>');
  var cust = esc(j.customer || '(no name)');
  var fo = '';
  if (j.foreman) {
    var tel = telHref(j.foreman.phone);
    fo = '<div class="fo">Foreman ' + esc(j.foreman.name) + (j.foreman.phone ? ' · ' + (tel ? '<a href="' + esc(tel) + '">' + esc(j.foreman.phone) + '</a>' : esc(j.foreman.phone)) : '') + '</div>';
  }
  var act;
  if (BUSY[k]) act = '<button class="btn" disabled>Saving…</button>';
  else if (mine === j.code) act = '<div class="booked">✓ Booked<small>' + esc(by.email || '') + '</small><button class="lnk" data-cancel="' + esc(k) + '">Cancel — can’t make it</button></div>';
  else if (mine) act = '<span class="taken">Day taken by another job</span>';
  else act = '<button class="btn pri" data-confirm="' + esc(k) + '">Confirm shoot</button>';
  return '<div class="row"><div class="tm">' + esc(fmt12(j.tmin) || '—') + '<small>' + esc(j.code) + '</small></div>'
    + '<div><div class="cu">' + (j.link ? '<a href="' + esc(j.link) + '" target="_blank" rel="noopener" title="Open the calendar event">' + cust + '</a>' : cust) + tag + (j.cl ? '<span class="tag cl">CL</span>' : '') + '</div>'
    + '<a class="ad" href="' + mapsLink(j.pickup) + '" target="_blank" rel="noopener">' + esc(j.pickup || '(no address)') + '</a>'
    + '<div class="me" style="text-align:left;margin-top:2px">' + esc(j.puState || '?') + ' → ' + esc(j.delState || '?') + ' · ' + esc(j.type || 'Local') + '</div>' + fo + '</div>'
    + '<div class="me"><b>' + n0(j.cf) + '</b> CF<br>' + (j.dist != null ? j.dist.toFixed(1) + ' mi' : '—') + '</div>'
    + '<div class="ac">' + act + '</div></div>';
}

function jobBy(k) { var p = k.split('|'); return (D.jobs || []).filter(function (j) { return j.code === p[0] && j.date === p[1]; })[0]; }
function dialog(j, cancel) {
  var m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = '<div class="dlg"><h3>' + (cancel ? 'Cancel this shoot?' : 'Confirm this shoot?') + '</h3>'
    + '<div class="bx"><b>' + esc(j.customer || '(no name)') + '</b><br>' + esc(dayLabel(j.date)) + (j.tmin != null ? ' · ' + esc(fmt12(j.tmin)) : '') + '<br>' + esc(j.code) + ' · ' + n0(j.cf) + ' CF<br>' + esc(j.pickup || '') + '</div>'
    + '<p>' + (cancel ? 'Support is told you can no longer make it, so the day can be given to someone else.' : 'One photographer per day. Support is told you are going.') + '</p>'
    + '<label>Your email</label><input type="email" placeholder="you@company.com" autocomplete="email" value="' + esc(photogEmail()) + '">'
    + '<div class="act"><button class="btn" data-x>' + (cancel ? 'Keep it' : 'Back') + '</button><button class="btn ' + (cancel ? 'neg' : 'pri') + '" data-ok>' + (cancel ? 'Yes, cancel' : 'Confirm') + '</button></div></div>';
  document.body.appendChild(m);
  var inp = m.querySelector('input'); inp.focus();
  m.addEventListener('click', function (e) { if (e.target === m) m.remove(); });
  m.querySelector('[data-x]').onclick = function () { m.remove(); };
  var onKey = function (e) { if (e.key === 'Escape') { m.remove(); document.removeEventListener('keydown', onKey); } else if (e.key === 'Enter') { m.querySelector('[data-ok]').click(); } };
  document.addEventListener('keydown', onKey);
  m.querySelector('[data-ok]').onclick = function () {
    var em = inp.value.trim();
    if (!validEmail(em)) { toast('Enter a valid email so we know who it is.'); return; }
    setPhotog(em); m.remove(); document.removeEventListener('keydown', onKey); send(j, cancel ? 'cancel' : 'confirm', em);
  };
}
function send(j, action, email) {
  var k = j.code + '|' + j.date; BUSY[k] = 1; render();
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, jobCode: j.code, jobDate: j.date, email: email }) })
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
    .then(function (x) {
      delete BUSY[k];
      if (x.ok) {
        if (action === 'confirm') { D.confirmed[j.date] = j.code; D.booked_by[j.date] = { email: email, at: new Date().toISOString() }; }
        else { delete D.confirmed[j.date]; delete D.booked_by[j.date]; }
        toast(action === 'confirm' ? '✓ Booked — support has been told.' : 'Cancelled — support has been told.'); render();
      } else { toast(x.b.error || 'Couldn’t save — try again.'); load(true); }
    })
    .catch(function () { delete BUSY[k]; render(); toast('No connection — nothing was saved. Try again.'); });
}
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target : null; if (!t || !D) return;
  var b;
  if ((b = t.closest('[data-confirm]'))) { var j = jobBy(b.getAttribute('data-confirm')); if (j) dialog(j, false); return; }
  if ((b = t.closest('[data-cancel]'))) { var j2 = jobBy(b.getAttribute('data-cancel')); if (j2) dialog(j2, true); return; }
  if ((b = t.closest('[data-st]'))) { var s = b.getAttribute('data-st'); if (F.st.has(s)) F.st.delete(s); else F.st.add(s); render(); return; }
  if ((b = t.closest('[data-f]'))) { var f = b.getAttribute('data-f'); F[f] = !F[f]; render(); return; }
  if ((b = t.closest('[data-goto]'))) { var el = document.getElementById('d-' + b.getAttribute('data-goto')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && D) load(true); });
setInterval(function () { if (!document.hidden) load(true); }, 180000);
load(false);
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zip to Zip — IT Request</title>
<style>
  /* HIS REDESIGN 2026-08-27: IT-only — every non-IT topic removed completely. Identify
     yourself, explain in detail, paste screenshots. Standalone like form.html; controls
     wear the kit's dropdown vocabulary in the page's light theme. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f7; color: #16202c;
         min-height: 100vh; display: flex; justify-content: center; padding: 24px 14px; }
  .card { width: 100%; max-width: 600px; background: #fff; border-radius: 14px;
          padding: 26px 24px; box-shadow: 0 6px 24px rgba(16,24,40,.08); height: fit-content; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #5b6b7c; margin-bottom: 20px; line-height: 1.5; }
  label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em;
          text-transform: uppercase; color: #8593a3; margin: 14px 0 5px; }
  input, textarea { width: 100%; font-family: inherit; font-size: 15px;
          border: 1px solid #d5dbe3; border-radius: 9px; padding: 10px 12px; outline: 0;
          background: #fff; }
  input:focus, textarea:focus { border-color: #7fa32b; }
  textarea { min-height: 150px; resize: vertical; }
  .hint { font-size: 12px; color: #8593a3; margin-top: 5px; line-height: 1.5; }
  button.send { margin-top: 20px; width: 100%; background: #7fa32b; color: #fff; border: 0;
           border-radius: 10px; font-size: 16px; font-weight: 700; padding: 13px;
           cursor: pointer; font-family: inherit; }
  button.send:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 14px; line-height: 1.5; }
  .msg.err { color: #b42318; }
  .done { text-align: center; padding: 30px 6px; }
  .done h2 { font-size: 20px; margin-bottom: 8px; }
  .done p { font-size: 14px; color: #5b6b7c; line-height: 1.6; }
  /* the kit dropdown, light-themed */
  .ksel { position: relative; }
  .ksel-btn { width: 100%; display: flex; align-items: center; justify-content: space-between;
          gap: 8px; font-family: inherit; font-size: 15px; text-align: left;
          border: 1px solid #d5dbe3; border-radius: 9px; padding: 10px 12px; background: #fff;
          cursor: pointer; color: #16202c; }
  .ksel-btn:focus { outline: 0; border-color: #7fa32b; }
  .ksel-btn .val.empty { color: #8593a3; }
  .ksel-btn .chev { color: #8593a3; font-size: 10px; flex: 0 0 auto; }
  .ksel-pop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
          background: #fff; border: 1px solid #d5dbe3; border-radius: 12px;
          box-shadow: 0 14px 38px rgba(16,24,40,.18); padding: 8px; }
  .ksel-pop.hidden { display: none; }
  .ksel-pop .q { width: 100%; font-size: 14px; padding: 8px 10px; margin-bottom: 6px;
          border: 1px solid #d5dbe3; border-radius: 8px; }
  .ksel-opts { max-height: 240px; overflow-y: auto; }
  .ksel-opt { padding: 9px 10px; border-radius: 8px; font-size: 14.5px; cursor: pointer;
          color: #33404e; }
  .ksel-opt:hover { background: #f2f6e9; color: #16202c; }
  .ksel-opt.sel { background: #eef4dd; color: #55701c; font-weight: 700; }
  .ksel-opt.hidden { display: none; }
  /* attached images */
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .shot { position: relative; width: 84px; height: 84px; border-radius: 10px;
          border: 1px solid #d5dbe3; overflow: hidden; background: #f2f4f7; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
          border-radius: 99px; background: rgba(16,32,44,.75); color: #fff; border: 0;
          font-size: 11px; line-height: 20px; cursor: pointer; padding: 0; }
  .addimg { margin-top: 8px; font-size: 13px; font-weight: 700; color: #7fa32b;
          background: none; border: 1px dashed #b9cf85; border-radius: 9px;
          padding: 8px 14px; cursor: pointer; font-family: inherit; }
  .drop { outline: 2px dashed #7fa32b; outline-offset: -2px; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>IT request</h1>
  <p class="sub">Something you need built, fixed, changed or looked at — it goes straight
  onto the IT board. The more detail you give, the faster it happens.</p>
  <div id="form" style="display:none">
    <label>Your name</label>
    <div id="kWho"></div>
    <label>What do you need? (short title)</label>
    <input id="title" maxlength="200" placeholder="e.g. Report shows wrong totals for August">
    <label>Detailed explanation</label>
    <textarea id="desc" maxlength="8000"
      placeholder="Explain exactly what you need: where it happens, what you expected, what you saw instead. Enough detail to act on without calling you back."></textarea>
    <div class="hint">📷 You can <b>paste a screenshot straight into the text box</b>
      (Ctrl+V), drop an image onto it, or add one below. Up to 5 images.</div>
    <div class="shots" id="shots"></div>
    <button type="button" class="addimg" id="addImg">+ Add image</button>
    <input type="file" id="file" accept="image/*" multiple style="display:none">
    <button class="send" id="send">Send request</button>
    <div class="msg err" id="err"></div>
  </div>
  <div class="msg" id="boot">Loading…</div>
</div>
<script>
(function () {
  var API = "https://ztz-bridge-32168089642.us-east4.run.app";
  var t = new URLSearchParams(location.search).get("t") || "";
  var $ = function (id) { return document.getElementById(id); };
  var sent = false;
  var images = [];                    // [{mime, b64, url}]

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* kit dropdown (button + searchable popover), standalone light edition */
  function kitSelect(host, opts) {
    var cur = opts.value || "";
    var wrap = document.createElement("div");
    wrap.className = "ksel";
    var withSearch = opts.values.length > 8;
    wrap.innerHTML = '<button type="button" class="ksel-btn"><span class="val"></span>'
      + '<span class="chev">▾</span></button>'
      + '<div class="ksel-pop hidden">'
      + (withSearch ? '<input class="q" placeholder="Search…">' : "")
      + '<div class="ksel-opts">'
      + opts.values.map(function (v) {
          return '<div class="ksel-opt" data-v="' + esc(v) + '">' + esc(v) + "</div>";
        }).join("")
      + "</div></div>";
    var btn = wrap.querySelector(".ksel-btn");
    var pop = wrap.querySelector(".ksel-pop");
    var q = wrap.querySelector(".q");
    function paint() {
      var val = btn.querySelector(".val");
      val.textContent = cur || opts.placeholder || "—";
      val.className = "val" + (cur ? "" : " empty");
      wrap.querySelectorAll(".ksel-opt").forEach(function (o) {
        o.classList.toggle("sel", o.dataset.v === cur);
      });
    }
    wrap.querySelectorAll(".ksel-opt").forEach(function (o) {
      o.onclick = function () {
        cur = o.dataset.v; paint(); pop.classList.add("hidden");
      };
    });
    if (q) q.oninput = function () {
      var needle = q.value.toLowerCase();
      wrap.querySelectorAll(".ksel-opt").forEach(function (o) {
        o.classList.toggle("hidden",
          needle && o.textContent.toLowerCase().indexOf(needle) < 0);
      });
    };
    btn.onclick = function (e) {
      e.stopPropagation();
      document.querySelectorAll(".ksel-pop").forEach(function (p) {
        if (p !== pop) p.classList.add("hidden");
      });
      pop.classList.toggle("hidden");
      if (!pop.classList.contains("hidden") && q) { q.value = ""; q.oninput(); q.focus(); }
    };
    pop.onclick = function (e) { e.stopPropagation(); };
    host.appendChild(wrap);
    paint();
    return { get: function () { return cur; } };
  }
  document.addEventListener("click", function () {
    document.querySelectorAll(".ksel-pop").forEach(function (p) {
      p.classList.add("hidden");
    });
  });

  /* ---- images: paste / drop / pick — all downscaled to ≤1280px JPEG before upload */
  function addImageFile(file) {
    if (!file || file.type.indexOf("image/") !== 0) return;
    if (images.length >= 5) { showErr("Up to 5 images."); return; }
    var img = new Image();
    img.onload = function () {
      var MAX = 1280;
      var w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        var k = Math.min(MAX / w, MAX / h);
        w = Math.round(w * k); h = Math.round(h * k);
      }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      var dataUrl = c.toDataURL("image/jpeg", 0.82);
      URL.revokeObjectURL(img.src);
      images.push({ mime: "image/jpeg", b64: dataUrl.split(",")[1], url: dataUrl });
      paintShots();
    };
    img.onerror = function () { showErr("Could not read that image."); };
    img.src = URL.createObjectURL(file);
  }
  function paintShots() {
    $("shots").innerHTML = images.map(function (im, i) {
      return '<div class="shot"><img src="' + im.url + '">'
        + '<button type="button" class="x" data-i="' + i + '">✕</button></div>';
    }).join("");
    document.querySelectorAll(".shot .x").forEach(function (b) {
      b.onclick = function () { images.splice(+b.dataset.i, 1); paintShots(); };
    });
    $("addImg").style.display = images.length >= 5 ? "none" : "";
  }
  function showErr(m) { $("err").textContent = m; setTimeout(function () {
    if ($("err").textContent === m) $("err").textContent = ""; }, 4000); }

  var hWho;
  fetch(API + "/api/_workreq?t=" + encodeURIComponent(t))
    .then(function (r) { return r.json().then(function (j) { return r.ok ? j : Promise.reject(j); }); })
    .then(function (j) {
      hWho = kitSelect($("kWho"), { values: j.names, placeholder: "— pick your name —" });
      $("boot").style.display = "none";
      $("form").style.display = "";
      var ta = $("desc");
      // PASTE a screenshot straight into the description — his ask, verbatim
      ta.addEventListener("paste", function (e) {
        var items = (e.clipboardData || {}).items || [];
        for (var i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.indexOf("image/") === 0) {
            e.preventDefault();
            addImageFile(items[i].getAsFile());
          }
        }
      });
      ta.addEventListener("dragover", function (e) { e.preventDefault(); ta.classList.add("drop"); });
      ta.addEventListener("dragleave", function () { ta.classList.remove("drop"); });
      ta.addEventListener("drop", function (e) {
        e.preventDefault(); ta.classList.remove("drop");
        var fs = (e.dataTransfer || {}).files || [];
        for (var i = 0; i < fs.length; i++) addImageFile(fs[i]);
      });
      $("addImg").onclick = function () { $("file").click(); };
      $("file").onchange = function () {
        for (var i = 0; i < this.files.length; i++) addImageFile(this.files[i]);
        this.value = "";
      };
    })
    .catch(function () {
      $("boot").textContent = "This link is not valid. Ask for a fresh request link.";
    });

  /* a filled form must not close silently (his ask): the browser's own leave dialog arms
     while anything is filled and unsent */
  window.addEventListener("beforeunload", function (e) {
    if (sent) return;
    var dirty = ($("title") && $("title").value.trim())
      || ($("desc") && $("desc").value.trim())
      || images.length || (hWho && hWho.get());
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  $("send").onclick = function () {
    $("err").textContent = "";
    var b = $("send"); b.disabled = true;
    fetch(API + "/api/_workreq", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        t: t, name: hWho.get(),
        title: $("title").value.trim(),
        description: $("desc").value.trim(),
        images: images.map(function (im) { return { mime: im.mime, b64: im.b64 }; }),
      }),
    }).then(function (r) { return r.json().then(function (j) { return r.ok && !j.error ? j : Promise.reject(j); }); })
      .then(function () {
        sent = true;
        $("card").innerHTML = '<div class="done"><h2>Request sent ✔</h2>' +
          "<p>It is on the IT board now. You can send another one any time " +
          "from this same link.</p></div>";
      })
      .catch(function (j) {
        b.disabled = false;
        $("err").textContent = (j && j.error) || "Could not send — try again.";
      });
  };
})();
</script>
</body>
</html>
